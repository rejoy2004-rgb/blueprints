name: Kestra gene-validation test (disposable server)

# Fork-only test of ONE question: does a real Kestra 2.0.6 evaluate the ClinVar monitor candidate's validate_genes condition and its
# state_key_prefix validator the way the offline interpreter predicts?
#
# NEVER include this file or ci/ in the upstream pull request. Publish it ONLY as the root (parentless) commit of the fork branch
# ci/kestra-gene-validation. A push to that branch triggers it.
#
# Isolation: the throwaway Kestra has no secrets, no Docker socket, no volumes and a loopback-only port. The full candidate flow is
# only validated and created, never executed. Executions run a derived validation-only flow made of Log, Fail and Loop tasks, so no
# call to NCBI, Slack, or any KV store is possible. Nothing is uploaded. No repository secret is used.

on:
  push:
    branches:
      - ci/kestra-gene-validation

permissions:
  contents: read

concurrency:
  group: kestra-gene-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  KESTRA_IMAGE: kestra/kestra:v2.0.6@sha256:bc2e8b5c639c3ff1f7ba9c1aadef4686a87669895a1d80c23d01c58d45785914
  # The only candidate this job may test (Batch 5 candidate of the isolated hardening work). Any other file stops the job.
  EXPECTED_CANDIDATE_SHA256: 19a33124e97deabe3cd4155025d2570614cdc2ab71b44dd53e966b167afa3978
  # One PASS per expected check; see expected_keys() in ci/kestra_gene_validation/run_validation.py.
  MIN_PASS: "84"

jobs:
  validate:
    name: validate_genes on Kestra 2.0.6 (validation-only flow)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out this branch (CI files and the candidate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the candidate is exactly the reviewed one
        run: |
          actual="$(sha256sum ci/kestra_gene_validation/candidate/clinvar-variant-reclassification-monitor.yaml | cut -d' ' -f1)"
          echo "candidate sha256: $actual"
          echo "expected:         $EXPECTED_CANDIDATE_SHA256"
          if [ "$actual" != "$EXPECTED_CANDIDATE_SHA256" ]; then
            echo "::error title=Wrong candidate::the candidate differs from the reviewed one; stopping"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (used by the driver and its unit tests)
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: "pyyaml==6.0.3"

      - name: Unit tests of the driver and of this workflow (fake Kestra on loopback, no external network)
        run: python -I ci/kestra_gene_validation/test_run_validation.py

      - name: Pull the pinned Kestra image
        run: docker pull "$KESTRA_IMAGE"

      - name: Start Kestra with throwaway credentials
        run: |
          password="Ci1$(openssl rand -hex 16)"
          b64_password="$(printf '%s' "$password" | base64 -w0)"
          b64_basic="$(printf '%s' "ci@example.com:$password" | base64 -w0)"
          echo "::add-mask::$password"
          echo "::add-mask::$b64_password"
          echo "::add-mask::$b64_basic"
          echo "KESTRA_USER=ci@example.com" >> "$GITHUB_ENV"
          echo "KESTRA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KESTRA_PASSWORD_B64=$b64_password" >> "$GITHUB_ENV"
          echo "KESTRA_BASIC_B64=$b64_basic" >> "$GITHUB_ENV"
          config="$(cat <<EOF
          kestra:
            anonymous-usage-report:
              enabled: false
            ui-anonymous-usage-report:
              enabled: false
            server:
              basic-auth:
                username: ci@example.com
                password: $password
          EOF
          )"
          docker run -d --name kestra \
            -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$config" \
            "$KESTRA_IMAGE" server local

      - name: Run the gene-validation cases through the REST API
        run: >
          python ci/kestra_gene_validation/run_validation.py
          --candidate ci/kestra_gene_validation/candidate/clinvar-variant-reclassification-monitor.yaml
          --expected-sha256 "$EXPECTED_CANDIDATE_SHA256"
          --base-url http://127.0.0.1:8080
          --min-pass "$MIN_PASS"

      - name: Kestra server log (errors and warnings only, credentials redacted)
        if: always()
        run: |
          docker logs kestra 2>&1 | sed -e "s|$KESTRA_PASSWORD|***|g" -e "s|$KESTRA_PASSWORD_B64|***|g" -e "s|$KESTRA_BASIC_B64|***|g" | grep -E ' (ERROR|WARN) ' | tail -n 80 || true

      - name: Stop Kestra
        if: always()
        run: docker rm -f kestra || true
