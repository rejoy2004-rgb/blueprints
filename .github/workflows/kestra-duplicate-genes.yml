name: Kestra duplicate-gene test (disposable server)

# Fork-only test of ONE question: how does a real Kestra 2.0.6 iterate the ClinVar monitor's Loop for duplicate and case-variant genes,
# under the ORIGINAL `values: "{{ inputs.genes }}"` and under the PROPOSED `values: "{{ inputs.genes | toJson | lower }}"`?
#
# NEVER include this file or ci/ in the upstream pull request. Publish it ONLY as the root (parentless) commit of the fork branch
# ci/kestra-duplicate-genes. A push to that branch triggers it.
#
# Isolation: the throwaway Kestra has no secrets, no Docker socket, no volumes and a loopback-only port. The two full candidate flows are
# only validated and created, never executed. Executions run derived validation-only flows made of Log, Fail and Loop tasks, so no call to
# NCBI, Slack, or any KV store is possible. Nothing is uploaded. No repository secret is used.

on:
  push:
    branches:
      - ci/kestra-duplicate-genes

permissions:
  contents: read

concurrency:
  group: kestra-duplicate-genes-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  KESTRA_IMAGE: kestra/kestra:v2.0.6@sha256:bc2e8b5c639c3ff1f7ba9c1aadef4686a87669895a1d80c23d01c58d45785914
  # The only two candidates this job may test. Any other file stops the job.
  EXPECTED_ORIGINAL_SHA256: 19a33124e97deabe3cd4155025d2570614cdc2ab71b44dd53e966b167afa3978
  EXPECTED_PROPOSED_SHA256: a266d05537c97484b52ecb89216b5ff346b50b3e0caa46184a02b30f51ef4061
  # One PASS per expected check; see expected_keys() in ci/kestra_duplicate_genes/run_duplicates.py.
  MIN_PASS: "243"

jobs:
  duplicates:
    name: Loop values with duplicate genes on Kestra 2.0.6 (validation-only flows)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out this branch (CI files and the two candidates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert both candidates are exactly the reviewed ones
        run: |
          orig="$(sha256sum ci/kestra_duplicate_genes/candidate/original/clinvar-variant-reclassification-monitor.yaml | cut -d' ' -f1)"
          prop="$(sha256sum ci/kestra_duplicate_genes/candidate/proposed/clinvar-variant-reclassification-monitor.yaml | cut -d' ' -f1)"
          echo "original sha256: $orig"
          echo "expected:        $EXPECTED_ORIGINAL_SHA256"
          echo "proposed sha256: $prop"
          echo "expected:        $EXPECTED_PROPOSED_SHA256"
          if [ "$orig" != "$EXPECTED_ORIGINAL_SHA256" ] || [ "$prop" != "$EXPECTED_PROPOSED_SHA256" ]; then
            echo "::error title=Wrong candidate::a candidate differs from the reviewed one; stopping"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (used by the driver and its unit tests)
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: "pyyaml==6.0.3"

      - name: Unit tests of the driver and of this workflow (fake Kestra on loopback, no external network)
        run: python -I ci/kestra_duplicate_genes/test_run_duplicates.py

      - name: Pull the pinned Kestra image
        run: docker pull "$KESTRA_IMAGE"

      - name: Start Kestra with throwaway credentials
        run: |
          password="Ci1$(openssl rand -hex 16)"
          b64_password="$(printf '%s' "$password" | base64 -w0)"
          b64_basic="$(printf '%s' "ci@example.com:$password" | base64 -w0)"
          echo "::add-mask::$password"
          echo "::add-mask::$b64_password"
          echo "::add-mask::$b64_basic"
          echo "KESTRA_USER=ci@example.com" >> "$GITHUB_ENV"
          echo "KESTRA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KESTRA_PASSWORD_B64=$b64_password" >> "$GITHUB_ENV"
          echo "KESTRA_BASIC_B64=$b64_basic" >> "$GITHUB_ENV"
          config="$(cat <<EOF
          kestra:
            anonymous-usage-report:
              enabled: false
            ui-anonymous-usage-report:
              enabled: false
            server:
              basic-auth:
                username: ci@example.com
                password: $password
          EOF
          )"
          docker run -d --name kestra \
            -p 127.0.0.1:8080:8080 \
            -e KESTRA_CONFIGURATION="$config" \
            "$KESTRA_IMAGE" server local

      - name: Run the duplicate-gene cases through the REST API
        run: >
          python ci/kestra_duplicate_genes/run_duplicates.py
          --original ci/kestra_duplicate_genes/candidate/original/clinvar-variant-reclassification-monitor.yaml
          --proposed ci/kestra_duplicate_genes/candidate/proposed/clinvar-variant-reclassification-monitor.yaml
          --expected-original-sha256 "$EXPECTED_ORIGINAL_SHA256"
          --expected-proposed-sha256 "$EXPECTED_PROPOSED_SHA256"
          --base-url http://127.0.0.1:8080
          --min-pass "$MIN_PASS"

      - name: Kestra server log (errors and warnings only, credentials redacted)
        if: always()
        run: |
          docker logs kestra 2>&1 | sed -e "s|$KESTRA_PASSWORD|***|g" -e "s|$KESTRA_PASSWORD_B64|***|g" -e "s|$KESTRA_BASIC_B64|***|g" | grep -E ' (ERROR|WARN) ' | tail -n 80 || true

      - name: Stop Kestra
        if: always()
        run: docker rm -f kestra || true
